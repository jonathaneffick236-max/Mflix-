<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MFLIX — Movies & Series</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.96);padding:14px 18px;border-bottom:1px solid #222}
.nav{display:flex;align-items:center;gap:18px;max-width:1200px;margin:auto}.logo{font-size:27px;font-weight:900;color:#e50914}.nav a{color:#ddd;text-decoration:none}.search{margin-left:auto;background:#181818;border:1px solid #333;color:#fff;border-radius:22px;padding:10px 14px;width:220px}
main{max-width:1200px;margin:auto;padding:20px}.hero{min-height:360px;padding:55px 25px;border-radius:18px;background:linear-gradient(90deg,#111 0%,rgba(17,17,17,.7) 45%,rgba(17,17,17,.15)),radial-gradient(circle at 80% 30%,#5b1515,#111 60%);display:flex;align-items:end}
.hero h1{font-size:48px;margin:0 0 12px}.hero p{max-width:600px;color:#ccc;line-height:1.5}.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}.primary{background:#e50914;color:#fff}.secondary{background:#fff;color:#111}
.categories{display:flex;gap:9px;overflow:auto;padding:20px 0}.cat{white-space:nowrap;background:#191919;border:1px solid #333;color:#ddd;padding:9px 14px;border-radius:20px;cursor:pointer}
h2{margin-top:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}.card{background:#121212;border-radius:10px;overflow:hidden;border:1px solid #222;cursor:pointer}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#222}.info{padding:11px}.title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#999;font-size:13px;margin-top:6px}
.empty{padding:45px;text-align:center;color:#999;background:#111;border-radius:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;overflow:auto}.modalbox{max-width:900px;margin:5vh auto;background:#111;border-radius:14px;padding:18px}.close{float:right;background:#222;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}.player{width:100%;max-height:70vh;background:#000}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:12px;background:#181818;border:1px solid #333;color:#fff;border-radius:7px}.form textarea{min-height:100px}.status{padding:10px;border-radius:7px;background:#191919;color:#bbb;display:none}
footer{padding:35px;text-align:center;color:#777}
@media(max-width:650px){.nav a{display:none}.search{width:145px}.hero h1{font-size:34px}.hero{min-height:300px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="nav">
<div class="logo">MFLIX</div><a href="#home">Home</a><a href="#movies">Movies</a><a href="#series">Series</a><input id="search" class="search" placeholder="Search movies..." oninput="render()">
</div></header>

<main id="home">
<section class="hero"><div><h1>Watch what you love.</h1><p>MFLIX is your movie and series platform. Add your licensed content through the upload panel and play it directly in the app.</p><button class="btn primary" onclick="document.getElementById('movies').scrollIntoView()">Browse Movies</button></div></section>
<div class="categories" id="cats"></div>
<section id="movies"><h2>Popular Movies</h2><div id="movieGrid" class="grid"></div></section>
<section id="series"><h2>Most Popular Series</h2><div id="seriesGrid" class="grid"></div></section>
<footer>MFLIX © 2026</footer>
</main>

<div id="watchModal" class="modal"><div class="modalbox">
<button class="close" onclick="closeModal()">Close</button><h2 id="watchTitle"></h2><video id="player" class="player" controls playsinline></video><p id="watchDesc"></p>
</div></div>

<div id="adminModal" class="modal"><div class="modalbox">
<button class="close" onclick="closeAdmin()">Close</button><h2>Upload Movie</h2>
<form class="form" onsubmit="uploadMovie(event)">
<input id="title" required placeholder="Movie title">
<textarea id="description" placeholder="Description"></textarea>
<input id="poster" type="file" accept="image/*" required>
<input id="video" type="file" accept="video/*" required>
<select id="category"><option>Entertainment</option><option>Comedy</option><option>Sports</option><option>Music</option><option>Kids</option><option>Education</option><option>Action</option><option>Horror</option><option>Fantasy</option><option>Animation</option><option>Series</option></select>
<input id="year" type="number" value="2026" min="1900" max="2100">
<button class="btn primary">Publish</button>
<div id="status" class="status"></div>
</form></div></div>

<script>
const API = localStorage.getItem("MFLIX_API") || "";
let movies=[];

function api(path){ return (API || location.origin) + path; }

const cats=["Entertainment","Comedy","Sports","Music","Kids","Education","Action","Horror","Fantasy","Animation"];
document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat" onclick="filterCat('${c}')">${c}</button>`).join("");

async function loadMovies(){
  try{
    const r=await fetch(api("/api/movies")); if(!r.ok) throw new Error("API error");
    movies=await r.json(); render();
  }catch(e){
    movies=[]; render();
    document.getElementById("movieGrid").innerHTML='<div class="empty">No movies loaded yet. Make sure the MFLIX backend is running and MFLIX_API is correct.</div>';
  }
}
function render(){
  const q=(document.getElementById("search").value||"").toLowerCase();
  const list=movies.filter(m=>(m.title||"").toLowerCase().includes(q));
  const card=m=>`<article class="card" onclick='watch(${JSON.stringify(m).replace(/'/g,"&#39;")})'><img class="poster" src="${m.posterUrl||''}" onerror="this.style.visibility='hidden'"><div class="info"><div class="title">${esc(m.title)}</div><div class="meta">${esc(m.category||"Movie")} • ${m.year||""}</div></div></article>`;
  document.getElementById("movieGrid").innerHTML=list.filter(m=>m.category!=="Series").map(card).join("")||'<div class="empty">No movies found.</div>';
  document.getElementById("seriesGrid").innerHTML=list.filter(m=>m.category==="Series").map(card).join("")||'<div class="empty">No series found.</div>';
}
function filterCat(c){movies=movies; const q=c.toLowerCase(); const arr=movies.filter(m=>(m.category||"").toLowerCase()===q); document.getElementById("movieGrid").innerHTML=arr.map(m=>`<article class="card" onclick='watch(${JSON.stringify(m).replace(/'/g,"&#39;")})'><img class="poster" src="${m.posterUrl||''}"><div class="info"><div class="title">${esc(m.title)}</div><div class="meta">${esc(m.category||"")}</div></div></article>`).join("")||'<div class="empty">No titles in this category.</div>';}
function watch(m){
 document.getElementById("watchTitle").textContent=m.title||"Movie";
 document.getElementById("watchDesc").textContent=m.description||"";
 const p=document.getElementById("player"); p.src=m.playbackUrl||m.videoUrl||""; document.getElementById("watchModal").style.display="block";
}
function closeModal(){document.getElementById("player").pause();document.getElementById("player").src="";document.getElementById("watchModal").style.display="none"}
function openAdmin(){document.getElementById("adminModal").style.display="block"}
function closeAdmin(){document.getElementById("adminModal").style.display="none"}
async function uploadMovie(e){
 e.preventDefault(); const s=document.getElementById("status"); s.style.display="block"; s.textContent="Uploading...";
 const fd=new FormData(); ["title","description","category","year"].forEach(id=>fd.append(id,document.getElementById(id).value));
 fd.append("poster",document.getElementById("poster").files[0]); fd.append("video",document.getElementById("video").files[0]);
 try{const r=await fetch(api("/api/movies"),{method:"POST",body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||"Upload failed");s.textContent="Published successfully.";document.querySelector("form").reset();await loadMovies();}
 catch(err){s.textContent=err.message}
}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
loadMovies();
</script>
</body>
</html>
