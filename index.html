<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MFLIX</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#090909ee;padding:14px 20px;border-bottom:1px solid #222}.nav{max-width:1400px;margin:auto;display:flex;gap:15px;align-items:center}.logo{font-size:28px;font-weight:900;color:#e50914;letter-spacing:2px}.search{display:flex;gap:8px;flex:1}.search input,.field input,.field textarea,.field select{background:#171717;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;width:100%}.search button,button.primary{background:#e50914;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:bold}.hero{padding:90px 7%;min-height:360px;background:linear-gradient(0deg,#050505,transparent),radial-gradient(circle at 80%,#591313,#050505 60%)}.hero h1{font-size:clamp(40px,7vw,80px);margin:0 0 15px}.hero p{max-width:650px;color:#bbb;line-height:1.7}.container{max-width:1400px;margin:auto;padding:20px}.chips{display:flex;gap:8px;overflow:auto;padding:15px 20px}.chips button{white-space:nowrap;background:#151515;color:#ddd;border:1px solid #333;border-radius:20px;padding:9px 14px}.chips button.active{background:#e50914;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:17px}.card{background:#111;border:1px solid #222;border-radius:11px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#181818}.info{padding:11px}.title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#888;font-size:12px;margin-top:6px}.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1;border:0;border-radius:7px;padding:8px 4px;font-size:11px;font-weight:bold}.watch{background:#e50914;color:#fff}.download{background:#fff;color:#000}.save{background:#292929;color:#fff}.disabled{opacity:.4;pointer-events:none}.admin{margin:50px 0;background:#101010;border:1px solid #282828;border-radius:14px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}.field label{font-size:13px;color:#aaa}.field textarea{min-height:100px}.tmdb{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.tmdb div{background:#171717;border:1px solid #292929;border-radius:8px;overflow:hidden;cursor:pointer}.tmdb img{width:100%;aspect-ratio:2/3;object-fit:cover}.tmdb b,.tmdb small{display:block;padding:6px}.tmdb small{color:#888}.progress{margin-top:18px;display:none}.bar{height:9px;background:#292929;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#e50914}.modal{display:none;position:fixed;inset:0;z-index:20;background:#000f;padding:20px;overflow:auto}.modal.show{display:block}.player{max-width:1100px;margin:25px auto}.close{float:right;background:#222;color:#fff;border:0;border-radius:7px;padding:9px 13px}.player video{width:100%;background:#000;margin-top:10px}.player h2{margin-bottom:5px}.player p{color:#aaa;line-height:1.6}.player button{border:0;border-radius:8px;padding:11px 15px;margin:6px 5px 0 0;font-weight:bold}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:12px 18px;border-radius:9px;z-index:30}.toast.show{display:block}@media(max-width:700px){.nav{flex-wrap:wrap}.search{flex-basis:100%}.form{grid-template-columns:1fr}.full{grid-column:auto}.grid{grid-template-columns:repeat(2,1fr)}.actions{flex-direction:column}}</style></head><body><header><div class="nav"><div class="logo">MFLIX</div><div class="search"><input id="search" placeholder="Search movies..."><button onclick="searchMovies()">Search</button></div></div></header><section class="hero"><h1>Watch Movies.</h1><p>Stream MFLIX movies and download supported movies for offline use.</p></section><div class="chips"><button class="active" onclick="filter('All',this)">All</button><button onclick="filter('Action',this)">Action</button><button onclick="filter('Comedy',this)">Comedy</button><button onclick="filter('Horror',this)">Horror</button><button onclick="filter('Fantasy',this)">Fantasy</button><button onclick="filter('Animation',this)">Animation</button><button onclick="filter('Sports',this)">Sports</button><button onclick="filter('Kids',this)">Kids</button></div><main class="container"><h2>Popular Movies</h2><div id="grid" class="grid"></div><section class="admin"><h2>Upload Movie</h2><p style="color:#888">Choose a TMDB match. The poster, description and release information will be filled automatically. The video goes directly to Mux.</p><div class="form"><div class="field"><label>Movie title</label><div style="display:flex;gap:8px"><input id="title" placeholder="Movie title"><button class="primary" onclick="tmdbSearch()">Find TMDB</button></div></div><div class="field"><label>Release year</label><input id="year" type="number"></div><div class="field full"><label>TMDB results</label><div id="tmdb" class="tmdb"></div></div><div class="field"><label>Category</label><select id="category"><option>Action</option><option>Adventure</option><option>Animation</option><option>Comedy</option><option>Drama</option><option>Fantasy</option><option>Horror</option><option>Romance</option><option>Sports</option><option>Thriller</option><option>Other</option></select></div><div class="field"><label>Poster fallback</label><input id="poster" type="file" accept="image/*"></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field full"><label>Video</label><input id="video" type="file" accept="video/*"></div></div><div id="progress" class="progress"><div class="bar"><div id="fill" class="fill"></div></div><p id="progressText" style="color:#aaa"></p></div><button id="publish" class="primary" style="margin-top:18px" onclick="upload()">Publish Movie</button></section></main><div id="modal" class="modal"><div class="player"><button class="close" onclick="closePlayer()">✕ Close</button><video id="vid" controls playsinline></video><h2 id="ptitle"></h2><p id="pdesc"></p><button class="download" id="pdownload" onclick="downloadCurrent()">⬇ Download</button><button class="save" id="psave" onclick="saveCurrent()">📁 Save to Phone / Drive</button></div></div><div id="toast" class="toast"></div><script>const API='https://cineforge-backend-3.onrender.com';let movies=[],cat='All',chosen=null,current=null,hls=null;const $=x=>document.getElementById(x);const toast=x=>{let t=$('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){try{let r=await fetch(API+'/api/movies');let d=await r.json();movies=d.movies||[];render()}catch(e){toast('Could not load movies.')}}function render(){let list=movies.filter(m=>cat==='All'||String(m.category||'').toLowerCase().includes(cat.toLowerCase()));$('grid').innerHTML=list.length?list.map(m=>`<article class="card"><img class="poster" src="${esc(m.tmdbPoster||'')}" onerror="this.style.display='none'"><div class="info"><div class="title">${esc(m.title)}</div><div class="meta">${esc(m.releaseYear||'')} • ${esc(m.category||'Movie')}</div><div class="actions"><button class="watch ${m.muxPlaybackId?'':'disabled'}" onclick="openMovie('${m.id}')">▶ Watch</button><button class="download ${m.downloadReady?'':'disabled'}" onclick="downloadMovie('${m.id}')">⬇ Download</button><button class="save ${m.downloadReady?'':'disabled'}" onclick="saveMovie('${m.id}')">📁 Save</button></div></div></article>`).join(''):'<p style="color:#888">No movies found.</p>'}function filter(x,b){cat=x;document.querySelectorAll('.chips button').forEach(a=>a.classList.remove('active'));b.classList.add('active');render()}async function searchMovies(){let q=$('search').value.trim();if(!q)return load();let r=await fetch(API+'/api/search?q='+encodeURIComponent(q));let d=await r.json();movies=d.movies||[];cat='All';render()}async function tmdbSearch(){let q=$('title').value.trim();if(!q)return toast('Enter a movie title.');let r=await fetch(API+'/api/tmdb/search?q='+encodeURIComponent(q)+'&year='+encodeURIComponent($('year').value));let d=await r.json();$('tmdb').innerHTML=(d.movies||[]).map(m=>`<div onclick='selectTMDB(${JSON.stringify(m).replace(/'/g,"&#39;")})'><img src="${esc(m.posterPath||'')}"><b>${esc(m.title)}</b><small>${esc(m.releaseYear||'')}</small></div>`).join('')||'<p style="color:#888">No matches.</p>'}function selectTMDB(m){chosen=m;$('title').value=m.title||'';$('year').value=m.releaseYear||'';$('desc').value=m.description||'';toast('TMDB movie selected.')}async function upload(){let title=$('title').value.trim(),file=$('video').files[0];if(!title)return toast('Enter a movie title.');if(!file)return toast('Select a video file.');$('publish').disabled=true;$('progress').style.display='block';try{let f=new FormData();f.append('title',title);f.append('description',$('desc').value);f.append('releaseYear',$('year').value);f.append('category',$('category').value);f.append('published','true');if(chosen?.tmdbId)f.append('tmdbId',chosen.tmdbId);if($('poster').files[0])f.append('poster',$('poster').files[0]);$('progressText').textContent='Creating Mux upload...';let r=await fetch(API+'/api/movies/start',{method:'POST',body:f}),d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Could not create upload');await muxUpload(d.uploadUrl,file,p=>{$('fill').style.width=p+'%';$('progressText').textContent='Uploading: '+p+'%'});$('progressText').textContent='Mux is processing the movie...';let ready=await waitMux(d.uploadId);if(!ready.downloadReady)toast('Movie is streaming-ready. Download MP4 is still preparing.');else toast('Movie published and download is ready.');$('title').value='';$('desc').value='';$('year').value='';$('video').value='';$('poster').value='';$('tmdb').innerHTML='';chosen=null;await load()}catch(e){toast(e.message)}finally{$('publish').disabled=false}}function muxUpload(url,file,cb){return new Promise((res,rej)=>{let x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type',file.type||'application/octet-stream');x.upload.onprogress=e=>{if(e.lengthComputable)cb(Math.round(e.loaded/e.total*100))};x.onload=()=>x.status>=200&&x.status<300?res():rej(Error('Mux upload failed: '+x.status));x.onerror=()=>rej(Error('Network error uploading to Mux.'));x.send(file)})}async function waitMux(id){for(let i=0;i<180;i++){let r=await fetch(API+'/api/mux/status/'+encodeURIComponent(id));let d=await r.json();if(!d.success)throw Error(d.message);if(d.movie?.status==='errored')throw Error('Mux processing failed.');if(d.movie?.downloadReady)return d.movie;if(d.movie?.status==='ready'){try{let x=await fetch(API+'/api/movies/'+encodeURIComponent(d.movie.id)+'/enable-download',{method:'POST'});let y=await x.json();if(y.movie?.downloadReady)return y.movie}catch{}}await new Promise(r=>setTimeout(r,5000))}throw Error('Mux processing is taking longer than expected.')}function openMovie(id){let m=movies.find(x=>String(x.id)===String(id));if(!m?.muxPlaybackId)return toast('Movie is still processing.');current=m;$('ptitle').textContent=m.title;$('pdesc').textContent=m.description||'';$('modal').classList.add('show');let v=$('vid');if(hls){hls.destroy();hls=null}v.removeAttribute('src');if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=m.playbackUrl||`https://stream.mux.com/${m.muxPlaybackId}.m3u8`;else if(Hls.isSupported()){hls=new Hls();hls.loadSource(m.playbackUrl||`https://stream.mux.com/${m.muxPlaybackId}.m3u8`);hls.attachMedia(v)}else return toast('HLS is not supported.');updatePlayer()}function closePlayer(){if(hls){hls.destroy();hls=null}$('vid').pause();$('vid').removeAttribute('src');$('vid').load();$('modal').classList.remove('show');current=null}function updatePlayer(){$('pdownload').classList.toggle('disabled',!current?.downloadReady);$('psave').classList.toggle('disabled',!current?.downloadReady)}async function fresh(id){try{let r=await fetch(API+'/api/movies/'+encodeURIComponent(id));let d=await r.json();return d.movie||null}catch{return null}}async function prepare(id){let m=await fresh(id);if(!m)return null;if(!m.downloadReady){let r=await fetch(API+'/api/movies/'+encodeURIComponent(id)+'/enable-download',{method:'POST'});let d=await r.json();m=d.movie||m}return m}async function downloadMovie(id){let m=await prepare(id);if(!m?.downloadReady||!m.downloadUrl)return toast('Download MP4 is still being prepared. Try again shortly.');window.open(m.downloadUrl,'_blank');toast('Download started.')}async function saveMovie(id){let m=await prepare(id);if(!m?.downloadReady||!m.downloadUrl)return toast('Downloadable file is still being prepared.');window.open(m.downloadUrl,'_blank');toast('Use your device Save/Share option to choose Phone, Files or Drive.')}function downloadCurrent(){if(current)downloadMovie(current.id)}function saveCurrent(){if(current)saveMovie(current.id)}load();</script></body></html>
